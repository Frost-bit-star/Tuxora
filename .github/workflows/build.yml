name: Tuxora Build

# Builds the self-contained Tuxora desktop APKs:
#   1. generates bootstraps that already contain the whole desktop stack
#      (openbox, termux-x11, polybar, thunar, xfce4, geany, netsurf, ...)
#      for every supported ABI, via scripts/build-tuxora-bootstraps.sh
#   2. builds one release APK per ABI, each shipping only its own bootstrap
#      plus the bundled Tuxora dotfiles (assets/tuxora-home.zip)
#
# On a `v*` tag push the APKs are attached to a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        shell: bash {0}
        run: |
          SDKMANAGER="$(dirname "$(command -v sdkmanager)")/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "ndk;29.0.14206865"

      - name: Cache termux-packages + Gradle
        uses: actions/cache@v4
        with:
          path: |
            /tmp/tuxora-bootstrap/termux-packages
            /tmp/tuxora-bootstrap/out
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: tuxora-${{ runner.os }}-${{ hashFiles('scripts/build-tuxora-bootstraps.sh') }}

      - name: Generate pre-configured bootstraps (all ABIs)
        shell: bash {0}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          bash scripts/build-tuxora-bootstraps.sh aarch64,arm,i686,x86_64

      - name: Build full release APKs (per ABI)
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
        run: |
          APK_VERSION_TAG="${GITHUB_REF_NAME:-dev}-github"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Keep full APKs and downloadable desktop assets
        shell: bash {0}
        run: |
          mkdir -p dist release-assets
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/src/main/cpp/bootstrap-*.zip release-assets/
          cp app/src/bundled/assets/tuxora-home.zip app/src/bundled/assets/tuxora-home-symlinks.txt release-assets/
          ls -la dist release-assets

      - name: Build slim APKs (desktop downloaded on first run)
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          TUXORA_SLIM: '1'
        run: |
          # Replace the bundled bootstraps with tiny placeholders so the slim APKs
          # stay small; the real desktop is downloaded on first launch.
          for arch in aarch64 arm i686 x86_64; do
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1],'w').writestr('SYMLINKS.txt','')" "app/src/main/cpp/bootstrap-$arch.zip"
          done
          ./gradlew --no-daemon :app:clean
          APK_VERSION_TAG="${GITHUB_REF_NAME:-dev}-github-slim"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APKs and checksums
        shell: bash {0}
        run: |
          cp app/build/outputs/apk/release/*.apk dist/
          ls -la dist
          (cd dist && sha256sum *.apk > sha256sums.txt && cat sha256sums.txt)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuxora-apks
          path: |
            dist/*.apk
            dist/sha256sums.txt
          if-no-files-found: error

      - name: Delete existing release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
          generate_release_notes: true
