name: Tuxora Build

# Builds the self-contained Tuxora desktop APKs:
#   1. generates bootstraps that already contain the whole desktop stack
#      (openbox, termux-x11, polybar, thunar, xfce4, geany, netsurf, ...)
#      for every supported ABI, via scripts/build-tuxora-bootstraps.sh
#   2. builds one release APK per ABI, each shipping only its own bootstrap
#      plus the bundled Tuxora dotfiles (assets/tuxora-home.zip)
#
# On a `v*` tag push the APKs are attached to a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager --install "ndk;29.0.14206865" && echo "y" | sdkmanager --licenses || true

      - name: Cache termux-packages + Gradle
        uses: actions/cache@v4
        with:
          path: |
            /tmp/tuxora-bootstrap/termux-packages
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: tuxora-${{ runner.os }}-${{ hashFiles('scripts/build-tuxora-bootstraps.sh') }}

      - name: Generate pre-configured bootstraps (all ABIs)
        shell: bash {0}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          bash scripts/build-tuxora-bootstraps.sh aarch64,arm,i686,x86_64

      - name: Build release APKs (per ABI)
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          splitAPKsForReleaseBuilds: '1'
        run: |
          APK_VERSION_TAG="${GITHUB_REF_NAME:-dev}-github"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APKs and checksums
        shell: bash {0}
        run: |
          APK_DIR="./app/build/outputs/apk/release"
          ls -la "$APK_DIR"
          (cd "$APK_DIR" && sha256sum *.apk > sha256sums.txt && cat sha256sums.txt)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuxora-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
          generate_release_notes: true
