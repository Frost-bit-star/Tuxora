name: Tuxora Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        shell: bash {0}
        run: |
          SDKMANAGER="$(dirname "$(command -v sdkmanager)")/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "ndk;29.0.14206865"

      - name: Cache termux-packages + Gradle
        uses: actions/cache@v4
        with:
          path: |
            /tmp/tuxora-bootstrap/termux-packages
            /tmp/tuxora-bootstrap/out
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: tuxora-${{ runner.os }}-${{ hashFiles('scripts/build-tuxora-bootstraps.sh') }}

      - name: Generate pre-configured bootstrap (arm64 only)
        shell: bash {0}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          bash scripts/build-tuxora-bootstraps.sh aarch64

      - name: Save real bootstrap for first-run download
        shell: bash {0}
        run: |
          mkdir -p release-assets
          cp app/src/main/cpp/bootstrap-aarch64.zip release-assets/bootstrap-aarch64.zip

      - name: Build slim arm64-v8a release (bootstrap downloaded on first run)
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          TUXORA_SLIM: '1'
          TUXORA_ABIS: arm64-v8a
        run: |
          ./gradlew --no-daemon :app:clean
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1],'w').writestr('SYMLINKS.txt','')" "app/src/main/cpp/bootstrap-aarch64.zip"
          APK_VERSION_TAG="${GITHUB_REF_NAME:-dev}-github-slim"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APKs, bootstraps and checksums
        shell: bash {0}
        run: |
          mkdir -p dist release-assets
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp app/src/bundled/assets/tuxora-home.zip app/src/bundled/assets/tuxora-home-symlinks.txt release-assets/ 2>/dev/null || true
          ls -la dist release-assets
          (cd dist && sha256sum *.apk > sha256sums.txt && cat sha256sums.txt)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuxora-apks
          path: |
            dist/*.apk
            dist/sha256sums.txt
          if-no-files-found: error

      - name: Delete existing release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/sha256sums.txt
            release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
