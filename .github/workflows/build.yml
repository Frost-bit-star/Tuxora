name: Tuxora Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        shell: bash {0}
        run: |
          SDKMANAGER="$(dirname "$(command -v sdkmanager)")/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "ndk;29.0.14206865"

      - name: Cache termux-packages + Gradle
        uses: actions/cache@v4
        with:
          path: |
            /tmp/tuxora-bootstrap/termux-packages
            /tmp/tuxora-bootstrap/out
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: tuxora-${{ runner.os }}-${{ hashFiles('scripts/build-tuxora-bootstraps.sh') }}

      - name: Build self-contained arm64-v8a release (full build)
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          TUXORA_ABIS: arm64-v8a
        run: |
          VER="${GITHUB_REF_NAME:-}"
          VER="${VER#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VER=""; fi
          export TERMUX_APP_VERSION_NAME="$VER"
          mkdir -p dist
          chmod +x scripts/*.sh scripts/*.py
          ./gradlew --no-daemon :app:clean
          bash scripts/build-tuxora-bootstraps.sh aarch64
          APK_VERSION_TAG="${GITHUB_REF_NAME:-dev}-github"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare distribution artifacts
        shell: bash {0}
        run: |
          mkdir -p dist
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" dist/tuxora.apk
          ls -la dist
          (cd dist && sha256sum tuxora.apk > sha256sums.txt && cat sha256sums.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuxora
          path: |
            dist/tuxora.apk
            dist/sha256sums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tuxora.apk
            dist/sha256sums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
